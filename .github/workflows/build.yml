name: Build Kivy AAB (Fixed Root Issue)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y python3-pip git zip unzip openjdk-17-jdk
        pip install --upgrade pip
        pip install cython==0.29.36 buildozer

    - name: Fix Buildozer root issue
      run: |
        export BUILDOZER_ALLOW_ROOT=1
        export CI=1
        echo "BUILDOZER_ALLOW_ROOT=1" >> $GITHUB_ENV
        echo "CI=1" >> $GITHUB_ENV

    - name: Build AAB (forced non-interactive)
      run: |
        yes | buildozer android release

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: snake-aab
        path: bin/*.aab
