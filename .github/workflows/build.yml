name: Build Android AAB (python-for-android)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
        python3-pip git zip unzip openjdk-17-jdk \
        build-essential autoconf libtool pkg-config \
        zlib1g-dev libffi-dev libssl-dev cmake

    - name: Install python-for-android
      run: |
        pip install --upgrade pip
        pip install cython==0.29.36 python-for-android buildozer

    - name: Initialize buildozer
      run: |
        buildozer init || true

    - name: Build APK (stable p4a mode)
      run: |
        buildozer android debug

    - name: Build Release AAB
      run: |
        buildozer android release

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: snake-aab
        path: bin/*.aab
