name: Build Snake Game AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # --------------------------------
      # Checkout repository
      # --------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------
      # Install dependencies
      # --------------------------------
      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool \
            pkg-config zlib1g-dev \
            libffi-dev libssl-dev cmake \
            wget

      # --------------------------------
      # Install Buildozer
      # --------------------------------
      - name: Install Buildozer
        run: |
          pip install --upgrade pip

          pip install \
            cython==0.29.36 \
            buildozer==1.5.0

      # --------------------------------
      # Install Android SDK manually
      # --------------------------------
      - name: Install Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk

          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          unzip commandlinetools-linux-11076708_latest.zip -d temp

          mv temp/cmdline-tools $HOME/android-sdk/cmdline-tools/latest

          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH

          yes | sdkmanager --licenses

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # --------------------------------
      # Build AAB
      # --------------------------------
      - name: Build Android AAB
        env:
          CI: true
          BUILDOZER_ALLOW_ROOT: 1
          ANDROIDSDK: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
        run: |
          export PATH=$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH

          buildozer -v android release

      # --------------------------------
      # Upload AAB
      # --------------------------------
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: snake-aab
          path: bin/*.aab
