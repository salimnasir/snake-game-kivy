name: Build Kivy AAB (FINAL STABLE)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # -------------------
    # Checkout
    # -------------------
    - uses: actions/checkout@v4

    # -------------------
    # System deps
    # -------------------
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
        python3-pip git zip unzip openjdk-17-jdk \
        autoconf libtool pkg-config \
        zlib1g-dev libncurses5-dev libffi-dev cmake

    # -------------------
    # Buildozer install
    # -------------------
    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36

    # -------------------
    # FIX LICENSES + BUILD
    # -------------------
    - name: Build AAB
      run: |
        export CI=1
        export BUILDOZER_ALLOW_ROOT=1

        yes | buildozer android clean
        yes | buildozer android release

    # -------------------
    # Upload AAB
    # -------------------
    - uses: actions/upload-artifact@v4
      with:
        name: snake-aab
        path: bin/*.aab
