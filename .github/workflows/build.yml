name: Build Kivy Android AAB (Final Stable)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: kivy/buildozer:latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Show environment
      run: |
        python --version
        buildozer --version

    - name: Clean build folder
      run: |
        rm -rf .buildozer || true

    - name: Build AAB
      run: |
        buildozer -v android release

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: snake-aab
        path: bin/*.aab
