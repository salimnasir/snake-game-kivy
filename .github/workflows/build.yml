name: Build Snake Game AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # -----------------------------------
      # Checkout Repository
      # -----------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------
      # Install System Dependencies
      # -----------------------------------
      - name: Install system packages
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            cmake

      # -----------------------------------
      # Install Stable Buildozer
      # -----------------------------------
      - name: Install Buildozer
        run: |
          pip install --upgrade pip

          pip install \
            cython==0.29.36 \
            buildozer==1.5.0 \
            python-for-android==2024.01.21

      # -----------------------------------
      # Accept Android SDK Licenses
      # -----------------------------------
      - name: Configure Android SDK licenses
        run: |
          mkdir -p ~/.buildozer/android/platform

          cat <<EOF > ~/.buildozer/android/platform/android-sdk-license
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          d56f5187479451eabf01fb78af6dfcb131a6481e
          EOF

      # -----------------------------------
      # Build Android AAB
      # -----------------------------------
      - name: Build Android AAB
        env:
          CI: true
          BUILDOZER_ALLOW_ROOT: 1
        run: |
          buildozer -v android release

      # -----------------------------------
      # Upload AAB Artifact
      # -----------------------------------
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: snake-aab
          path: bin/*.aab
