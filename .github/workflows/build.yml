name: Build Android AAB (Stable)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: kivy/buildozer:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Clean build
      run: |
        buildozer android clean || true

    - name: Build AAB
      run: |
        buildozer -v android release

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: snake-aab
        path: bin/*.aab
