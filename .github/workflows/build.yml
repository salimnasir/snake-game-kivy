name: Build Snake Game AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------
      # Checkout Repository
      # --------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------
      # Install System Dependencies
      # --------------------------------
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3-pip \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            cmake

      # --------------------------------
      # Install Buildozer
      # --------------------------------
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      # --------------------------------
      # Setup Environment
      # --------------------------------
      - name: Setup environment
        run: |
          export CI=1
          export BUILDOZER_ALLOW_ROOT=1

      # --------------------------------
      # Android SDK Update
      # --------------------------------
      - name: Android update
        run: |
          export CI=1
          export BUILDOZER_ALLOW_ROOT=1

          buildozer android update

      # --------------------------------
      # Build Release AAB
      # --------------------------------
      - name: Build Android AAB
        run: |
          export CI=1
          export BUILDOZER_ALLOW_ROOT=1

          buildozer -v android release

      # --------------------------------
      # Upload AAB Artifact
      # --------------------------------
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: snake-aab
          path: bin/*.aab
